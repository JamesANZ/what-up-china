<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Find out what's going on in the Chinese web"
    />
    <title>what-up-china</title>
    <!-- Hotjar Tracking Code for https://whatupchina.org/ -->
    <script>
      (function (h, o, t, j, a, r) {
        h.hj =
          h.hj ||
          function () {
            (h.hj.q = h.hj.q || []).push(arguments);
          };
        h._hjSettings = { hjid: 2403778, hjsv: 6 };
        a = o.getElementsByTagName("head")[0];
        r = o.createElement("script");
        r.async = 1;
        r.src = t + h._hjSettings.hjid + j + h._hjSettings.hjsv;
        a.appendChild(r);
      })(window, document, "https://static.hotjar.com/c/hotjar-", ".js?sv=");
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="google_translate_element" style="display: none"></div>
    <div id="root"></div>
    <script type="text/javascript">
      (function () {
        const STORAGE_KEY = "whatupchina-preferred-lang";
        const browserLanguage = (
          localStorage.getItem(STORAGE_KEY) ||
          navigator.language ||
          navigator.userLanguage ||
          "en"
        )
          .toLowerCase()
          .split("-")[0];

        function applyLanguage(combo, language) {
          if (!combo) {
            return;
          }
          const validOptions = Array.from(combo.options).map(
            (opt) => opt.value,
          );
          if (!validOptions.includes(language)) {
            return;
          }
          if (combo.value !== language) {
            combo.value = language;
            combo.dispatchEvent(new Event("change"));
          }
        }

        function setPreferredLanguage(attempts = 25) {
          const combo = document.querySelector(".goog-te-combo");
          if (!combo) {
            if (attempts <= 0) {
              return;
            }
            setTimeout(() => setPreferredLanguage(attempts - 1), 400);
            return;
          }
          applyLanguage(combo, browserLanguage || "en");
          combo.addEventListener("change", (event) => {
            localStorage.setItem(STORAGE_KEY, event.target.value);
          });
        }

        window.googleTranslateElementInit = function () {
          new google.translate.TranslateElement(
            {
              pageLanguage: "zh",
              autoDisplay: true,
            },
            "google_translate_element",
          );
          setPreferredLanguage();
        };

        function injectTranslateScript() {
          if (document.getElementById("google-translate-script")) {
            return;
          }
          const script = document.createElement("script");
          script.id = "google-translate-script";
          script.type = "text/javascript";
          script.async = true;
          script.src =
            "https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit";
          script.referrerPolicy = "no-referrer-when-downgrade";
          document.body.appendChild(script);
        }

        if (document.readyState === "complete") {
          injectTranslateScript();
        } else {
          window.addEventListener("load", injectTranslateScript);
        }
      })();
    </script>
  </body>
</html>
