    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Find out what's going on in the Chinese web"
    />
    <title>what-up-china</title>
    <!-- Hotjar Tracking Code for https://whatupchina.org/ -->
    <script>
      (function (h, o, t, j, a, r) {
        h.hj =
          h.hj ||
          function () {
            (h.hj.q = h.hj.q || []).push(arguments);
          };
        h._hjSettings = { hjid: 2403778, hjsv: 6 };
        a = o.getElementsByTagName("head")[0];
        r = o.createElement("script");
        r.async = 1;
        r.src = t + h._hjSettings.hjid + j + h._hjSettings.hjsv;
        a.appendChild(r);
      })(window, document, "https://static.hotjar.com/c/hotjar-", ".js?sv=");
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="google_translate_element" style="display: none"></div>
    <div id="root"></div>
    <script type="text/javascript">
      (function () {
        const browserLanguage = (
          navigator.language ||
          navigator.userLanguage ||
          "en"
        ).toLowerCase();

        function setPreferredLanguage() {
          const combo = document.querySelector(".goog-te-combo");
          if (!combo) {
            return;
          }
          const normalized = browserLanguage.split("-")[0];
          const options = Array.from(combo.options).map((opt) => opt.value);
          if (options.includes(normalized) && combo.value !== normalized) {
            combo.value = normalized;
            combo.dispatchEvent(new Event("change"));
          }
        }

        window.googleTranslateElementInit = function () {
          new google.translate.TranslateElement(
            {
              pageLanguage: "zh",
              autoDisplay: true,
            },
            "google_translate_element",
          );
          setTimeout(setPreferredLanguage, 0);
        };
      })();
    </script>
    <script
      type="text/javascript"
      src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"
    ></script>
  </body>
